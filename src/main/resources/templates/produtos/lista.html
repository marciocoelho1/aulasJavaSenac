<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Produtos | Loja Senac</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div th:replace="~{fragments/mensagens :: mensagens}"></div>

    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Produtos</h1>
            <p class="text-secondary mb-0">Gerencie os produtos cadastrados na loja.</p>
        </div>

        <a class="btn btn-primary" th:href="@{/produtos/novo}">Novo produto</a>
    </div>

    <div class="card border-0 shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Código</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Categoria</th>
                    <th class="text-end">Ações</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="produto : ${produtos}">
                    <td th:text="${produto.id}"></td>
                    <td>
                        <strong th:text="${produto.nome}"></strong>
                        <small class="d-block text-secondary"
                               th:if="${produto.descricao != null and !produto.descricao.isBlank()}"
                               th:text="${produto.descricao}"></small>
                    </td>
                    <td th:text="${#numbers.formatCurrency(produto.preco)}"></td>
                    <td th:text="${produto.quantidade}"></td>
                    <td th:text="${produto.categoria.nome}"></td>
                    <td class="text-end text-nowrap">
                        <a class="btn btn-outline-warning btn-sm"
                           th:href="@{/produtos/editar/{id}(id=${produto.id})}">
                            Editar
                        </a>

                        <form class="d-inline"
                              th:action="@{/produtos/excluir/{id}(id=${produto.id})}"
                              method="post"
                              onsubmit="return confirm('Deseja excluir este produto?')">
                            <button class="btn btn-outline-danger btn-sm" type="submit">Excluir</button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="6" class="text-center py-5 text-secondary">
                        Nenhum produto cadastrado.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
