<!DOCTYPE html>
<html lang="pt-br"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de produto</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body>

<div class="container mt-4">
    <h1>Cadastro de produto</h1>

    <form
            th:action="@{/produtos/salvar}"
            th:object="${produto}"
            method="post">

        <input type="hidden" th:field="*{id}">

        <div class="mb-3">
            <label class="form-label">Nome</label>

            <input
                    class="form-control"
                    type="text"
                    th:field="*{nome}"
                    required>
        </div>

        <div class="mb-3">
            <label class="form-label">Descrição</label>

            <textarea
                    class="form-control"
                    th:field="*{descricao}">
            </textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Preço</label>

            <input
                    class="form-control"
                    type="number"
                    step="0.01"
                    min="0"
                    th:field="*{preco}"
                    required>
        </div>

        <div class="mb-3">
            <label class="form-label">Quantidade</label>

            <input
                    class="form-control"
                    type="number"
                    min="0"
                    th:field="*{quantidade}"
                    required>
        </div>

        <div class="mb-3">
            <label class="form-label">Categoria</label>

            <select
                    class="form-select"
                    th:field="*{categoria}"
                    required>

                <option value="">Selecione</option>

                <option
                        th:each="categoria : ${categorias}"
                        th:value="${categoria.id}"
                        th:text="${categoria.nome}">
                </option>
            </select>
        </div>

        <button class="btn btn-success" type="submit">
            Salvar
        </button>

        <a class="btn btn-secondary"
           th:href="@{/produtos}">
            Voltar
        </a>
    </form>
</div>

</body>
</html>
