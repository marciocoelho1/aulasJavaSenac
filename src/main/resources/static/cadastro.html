<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro de produtos</title>

  <link
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
  >

  <style>
    body {
      background: #f3f4f6;
    }

    main {
      max-width: 560px;
      margin: 60px auto;
      padding: 28px;
      background: white;
      border-radius: 12px;
    }
  </style>
</head>

<body>
<main>
  <h1 class="h3 mb-4">Cadastrar produto</h1>

  <form id="formProduto">
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input
              id="nome"
              class="form-control"
              type="text"
              maxlength="100"
              required
      >
    </div>

    <div class="mb-3">
      <label for="preco" class="form-label">Preço</label>
      <input
              id="preco"
              class="form-control"
              type="number"
              min="0.01"
              max="99999999.99"
              step="0.01"
              required
      >
    </div>

    <button id="botaoSalvar" class="btn btn-primary" type="submit">
      Salvar
    </button>
  </form>

  <p id="mensagem" class="mt-3" role="status"></p>
</main>

<script>
  const formulario = document.getElementById("formProduto");
  const mensagem = document.getElementById("mensagem");
  const botao = document.getElementById("botaoSalvar");

  formulario.addEventListener("submit", async (evento) => {
    evento.preventDefault();

    const produto = {
      nome: document.getElementById("nome").value.trim(),
      preco: document.getElementById("preco").value
    };

    botao.disabled = true;
    mensagem.textContent = "Salvando...";

    try {
      const resposta = await fetch("/api/produtos", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(produto)
      });

      if (!resposta.ok) {
        throw new Error("Não foi possível cadastrar. Confira os dados.");
      }

      mensagem.textContent = await resposta.text();
      formulario.reset();
    } catch (erro) {
      mensagem.textContent = erro.message;
    } finally {
      botao.disabled = false;
    }
  });
</script>
</body>
</html>
