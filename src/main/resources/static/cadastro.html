<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sistema de Cadastros - Gestão de Produtos</title>

  <!-- Bootstrap CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <style>
    body {
      font-family: 'Segoe UI', system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 0;
    }

    /* Top Navigation Header */
    .top-header {
      background-color: #0f172a;
      color: #ffffff;
      padding: 14px 24px;
      border-bottom: 3px solid #2563eb;
    }

    .brand-title {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-subtitle {
      color: #94a3b8;
      font-weight: 400;
      font-size: 0.9rem;
    }

    .user-badge {
      font-size: 0.85rem;
      background-color: #1e293b;
      border: 1px solid #334155;
      padding: 4px 12px;
      border-radius: 4px;
      color: #cbd5e1;
    }

    /* Main Container & Layout */
    .app-container {
      max-width: 1000px;
      margin: 24px auto;
      padding: 0 16px;
    }

    /* Breadcrumbs Bar */
    .breadcrumb-bar {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      padding: 10px 16px;
      margin-bottom: 20px;
      font-size: 0.875rem;
      color: #64748b;
    }

    .breadcrumb-bar strong {
      color: #0f172a;
    }

    /* System Panel (Form Box) */
    .sys-panel {
      background-color: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      margin-bottom: 24px;
    }

    .sys-panel-header {
      background-color: #f8fafc;
      border-bottom: 1px solid #cbd5e1;
      padding: 12px 20px;
      font-weight: 700;
      font-size: 0.95rem;
      color: #0f172a;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .sys-panel-body {
      padding: 24px;
    }

    /* Form Labels & Controls */
    .form-label {
      font-weight: 600;
      font-size: 0.875rem;
      color: #334155;
      margin-bottom: 6px;
    }

    .form-control, .form-select {
      border: 1px solid #94a3b8;
      border-radius: 4px;
      font-size: 0.95rem;
      padding: 8px 12px;
    }

    .form-control:focus, .form-select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    }

    .btn-action-container {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #e2e8f0;
    }

    /* Alert / Message Notification Area */
    #mensagem {
      font-size: 0.925rem;
      padding: 8px 12px;
      border-radius: 4px;
    }

    /* Table Styling for Registry Listing */
    .table thead th {
      background-color: #1e293b;
      color: #ffffff;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 10px 14px;
      border: none;
    }

    .table tbody td {
      padding: 10px 14px;
      font-size: 0.9rem;
      vertical-align: middle;
    }

    .table-bordered {
      border: 1px solid #cbd5e1;
    }

    .table-striped > tbody > tr:nth-of-type(odd) > * {
      background-color: #f8fafc;
    }
  </style>
</head>

<body>

<!-- Cabecalho do Sistema -->
<header class="top-header">
  <div class="d-flex justify-content-between align-items-center max-w-1000 mx-auto px-3">
    <div class="brand-title">
      <span>SISTEMA DE CADASTROS</span>
      <span class="brand-subtitle">| Módulo de Produtos</span>
    </div>
    <div class="user-badge">
      Sessão: <strong>Administrador</strong>
    </div>
  </div>
</header>

<main class="app-container">

  <!-- Barra de Localizacao / Trilha -->
  <div class="breadcrumb-bar d-flex justify-content-between align-items-center">
    <div>
      Cadastros &gt; <strong>Gerenciamento de Produtos</strong>
    </div>
    <span class="badge bg-secondary">Módulo Ativo</span>
  </div>

  <!-- Painel Principal de Cadastro -->
  <section class="sys-panel">
    <div class="sys-panel-header">
      Formulário de Manutenção
    </div>
    <div class="sys-panel-body">

      <!-- Menu Suspenso de Operaçoes -->
      <div class="mb-4">
        <label for="operacao" class="form-label">Selecione a Operação:</label>
        <select id="operacao" class="form-select form-select-lg">
          <option value="CADASTRAR">Cadastrar Produto</option>
          <option value="LISTAR">Listar Produtos</option>
          <option value="ATUALIZAR">Atualizar Produto</option>
          <option value="EXCLUIR">Excluir Produto</option>
        </select>
      </div>

      <form id="formProduto">
        <div class="row g-3">
          <!-- Campo ID (usado para Atualizar e Excluir) -->
          <div id="containerId" class="col-md-4 d-none">
            <label for="idProduto" class="form-label">ID do Produto</label>
            <input
              id="idProduto"
              class="form-control"
              type="number"
              min="0"
              placeholder="Digite o ID do produto (ex: 0, 1, 2...)"
            >
          </div>

          <!-- Campo Nome -->
          <div id="containerNome" class="col-md-8">
            <label for="nome" class="form-label">Nome</label>
            <input
              id="nome"
              class="form-control"
              type="text"
              maxlength="100"
              placeholder="Ex: Teclado Mecânico"
            >
          </div>

          <!-- Campo Preco -->
          <div id="containerPreco" class="col-md-4">
            <label for="preco" class="form-label">Preço (R$)</label>
            <input
              id="preco"
              class="form-control"
              type="number"
              min="0.01"
              max="99999999.99"
              step="0.01"
              placeholder="Ex: 150.50"
            >
          </div>
        </div>

        <div class="btn-action-container">
          <button id="botaoAcao" class="btn btn-primary w-100 fs-5" type="submit">
            Cadastrar
          </button>
        </div>
      </form>

      <p id="mensagem" class="mt-3 text-center fw-bold" role="status"></p>

    </div>
  </section>

  <!-- Area para exibição da Lista de Produtos -->
  <section id="containerLista" class="sys-panel d-none">
    <div class="sys-panel-header">
      Produtos Cadastrados
    </div>
    <div class="sys-panel-body p-0">
      <div class="table-responsive">
        <table class="table table-bordered table-striped table-hover m-0">
          <thead class="table-dark">
            <tr>
              <th style="width: 15%;">ID</th>
              <th style="width: 60%;">Nome</th>
              <th style="width: 25%;">Preço (R$)</th>
            </tr>
          </thead>
          <tbody id="tabelaProdutosBody">
            <!-- As linhas dos produtos serao inseridas via JS -->
          </tbody>
        </table>
      </div>
    </div>
  </section>

</main>

<script>
  const operacaoSelect = document.getElementById("operacao");
  const formulario = document.getElementById("formProduto");
  const containerId = document.getElementById("containerId");
  const containerNome = document.getElementById("containerNome");
  const containerPreco = document.getElementById("containerPreco");
  const idInput = document.getElementById("idProduto");
  const nomeInput = document.getElementById("nome");
  const precoInput = document.getElementById("preco");
  const botaoAcao = document.getElementById("botaoAcao");
  const mensagem = document.getElementById("mensagem");
  const containerLista = document.getElementById("containerLista");
  const tabelaBody = document.getElementById("tabelaProdutosBody");

  // Altera os campos visíveis conforme a opção escolhida no menu suspenso
  operacaoSelect.addEventListener("change", () => {
    const op = operacaoSelect.value;
    mensagem.textContent = "";
    containerLista.classList.add("d-none");

    if (op === "CADASTRAR") {
      containerId.classList.add("d-none");
      containerNome.classList.remove("d-none");
      containerPreco.classList.remove("d-none");
      botaoAcao.classList.remove("d-none");
      botaoAcao.textContent = "Cadastrar";
      botaoAcao.className = "btn btn-primary w-100 fs-5";
      idInput.required = false;
      nomeInput.required = true;
      precoInput.required = true;
    } else if (op === "LISTAR") {
      containerId.classList.add("d-none");
      containerNome.classList.add("d-none");
      containerPreco.classList.add("d-none");
      botaoAcao.classList.remove("d-none");
      botaoAcao.textContent = "Atualizar Lista";
      botaoAcao.className = "btn btn-info w-100 fs-5 text-white";
      idInput.required = false;
      nomeInput.required = false;
      precoInput.required = false;
      buscarEExibirProdutos();
    } else if (op === "ATUALIZAR") {
      containerId.classList.remove("d-none");
      containerNome.classList.remove("d-none");
      containerPreco.classList.remove("d-none");
      botaoAcao.classList.remove("d-none");
      botaoAcao.textContent = "Atualizar";
      botaoAcao.className = "btn btn-warning w-100 fs-5 text-dark";
      idInput.required = true;
      nomeInput.required = true;
      precoInput.required = true;
    } else if (op === "EXCLUIR") {
      containerId.classList.remove("d-none");
      containerNome.classList.add("d-none");
      containerPreco.classList.add("d-none");
      botaoAcao.classList.remove("d-none");
      botaoAcao.textContent = "Excluir";
      botaoAcao.className = "btn btn-danger w-100 fs-5";
      idInput.required = true;
      nomeInput.required = false;
      precoInput.required = false;
    }
  });

  // Função para buscar e exibir a lista de produtos (GET)
  async function buscarEExibirProdutos() {
    mensagem.textContent = "Carregando produtos...";
    mensagem.className = "mt-3 text-center fw-bold text-info";
    tabelaBody.innerHTML = "";

    try {
      const resposta = await fetch("/api/produtos");
      if (!resposta.ok) throw new Error("Erro ao buscar a lista de produtos.");

      const produtos = await resposta.json();
      containerLista.classList.remove("d-none");

      if (produtos.length === 0) {
        mensagem.textContent = "Nenhum produto cadastrado.";
        mensagem.className = "mt-3 text-center fw-bold text-warning";
        return;
      }

      mensagem.textContent = "";

      produtos.forEach(p => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td><strong>${p.id !== undefined && p.id !== null ? p.id : '-'}</strong></td>
          <td>${p.nome}</td>
          <td>R$ ${parseFloat(p.preco).toFixed(2)}</td>
        `;
        tabelaBody.appendChild(tr);
      });
    } catch (erro) {
      mensagem.textContent = erro.message;
      mensagem.className = "mt-3 text-center fw-bold text-danger";
    }
  }

  // Manipula o envio do formulário de acordo com a operação selecionada
  formulario.addEventListener("submit", async (evento) => {
    evento.preventDefault();
    const op = operacaoSelect.value;

    botaoAcao.disabled = true;
    mensagem.className = "mt-3 text-center fw-bold text-secondary";

    try {
      if (op === "CADASTRAR") {
        mensagem.textContent = "Cadastrando...";
        const produto = {
          nome: nomeInput.value.trim(),
          preco: precoInput.value
        };

        const resposta = await fetch("/api/produtos", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(produto)
        });

        const texto = await resposta.text();
        if (!resposta.ok) throw new Error(texto || "Erro ao cadastrar.");

        mensagem.textContent = texto;
        mensagem.className = "mt-3 text-center fw-bold text-success";
        formulario.reset();

      } else if (op === "LISTAR") {
        await buscarEExibirProdutos();

      } else if (op === "ATUALIZAR") {
        const id = idInput.value;
        mensagem.textContent = "Atualizando...";
        const produto = {
          nome: nomeInput.value.trim(),
          preco: precoInput.value
        };

        const resposta = await fetch(`/api/produtos/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(produto)
        });

        const texto = await resposta.text();
        if (!resposta.ok) throw new Error(texto || "Erro ao atualizar.");

        mensagem.textContent = texto;
        mensagem.className = "mt-3 text-center fw-bold text-success";
        formulario.reset();

      } else if (op === "EXCLUIR") {
        const id = idInput.value;
        mensagem.textContent = "Excluindo...";

        const resposta = await fetch(`/api/produtos/${id}`, {
          method: "DELETE"
        });

        const texto = await resposta.text();
        if (!resposta.ok) throw new Error(texto || "Erro ao excluir.");

        mensagem.textContent = texto;
        mensagem.className = "mt-3 text-center fw-bold text-success";
        formulario.reset();
      }
    } catch (erro) {
      mensagem.textContent = erro.message;
      mensagem.className = "mt-3 text-center fw-bold text-danger";
    } finally {
      botaoAcao.disabled = false;
    }
  });
</script>
</body>
</html>
