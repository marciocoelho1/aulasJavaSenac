services:
  mysql:
    image: mysql:8.4
    container_name: loja-senac-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: loja_senac
      MYSQL_ROOT_PASSWORD: root
      TZ: America/Sao_Paulo
    ports:
      - "3306:3306"
    volumes:
      - loja_senac_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  loja_senac_mysql_data:
