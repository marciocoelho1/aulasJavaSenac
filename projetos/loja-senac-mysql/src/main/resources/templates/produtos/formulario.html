<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${produtoForm.id == null ? 'Novo produto' : 'Editar produto'} + ' | Loja Senac'"></title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="mb-4">
                <h1 class="h3 mb-1" th:text="${produtoForm.id == null ? 'Novo produto' : 'Editar produto'}"></h1>
                <p class="text-secondary mb-0">Preencha os dados e salve o cadastro.</p>
            </div>

            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">
                    <form th:action="@{/produtos/salvar}" th:object="${produtoForm}" method="post">
                        <input type="hidden" th:field="*{id}">

                        <div class="mb-3">
                            <label class="form-label" for="nome">Nome</label>
                            <input id="nome" class="form-control"
                                   th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid'"
                                   type="text" th:field="*{nome}" maxlength="100" autofocus>
                            <div class="invalid-feedback" th:errors="*{nome}"></div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="descricao">Descrição</label>
                            <textarea id="descricao" class="form-control" rows="3"
                                      th:classappend="${#fields.hasErrors('descricao')} ? 'is-invalid'"
                                      th:field="*{descricao}" maxlength="255"></textarea>
                            <div class="invalid-feedback" th:errors="*{descricao}"></div>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="preco">Preço</label>
                                <input id="preco" class="form-control"
                                       th:classappend="${#fields.hasErrors('preco')} ? 'is-invalid'"
                                       type="number" step="0.01" min="0.01" th:field="*{preco}">
                                <div class="invalid-feedback" th:errors="*{preco}"></div>
                            </div>

                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="quantidade">Quantidade</label>
                                <input id="quantidade" class="form-control"
                                       th:classappend="${#fields.hasErrors('quantidade')} ? 'is-invalid'"
                                       type="number" min="0" th:field="*{quantidade}">
                                <div class="invalid-feedback" th:errors="*{quantidade}"></div>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label" for="categoriaId">Categoria</label>
                            <select id="categoriaId" class="form-select"
                                    th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'"
                                    th:field="*{categoriaId}">
                                <option value="">Selecione uma categoria</option>
                                <option th:each="categoria : ${categorias}"
                                        th:value="${categoria.id}"
                                        th:text="${categoria.nome}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{categoriaId}"></div>
                        </div>

                        <div class="d-flex gap-2">
                            <button class="btn btn-success" type="submit">Salvar</button>
                            <a class="btn btn-outline-secondary" th:href="@{/produtos}">Cancelar</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
